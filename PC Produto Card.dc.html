<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="display:flex;flex-direction:column;gap:12px;padding:8px;border:1px solid #EEEAF4;border-radius:16px;height:100%">
    <div style="aspect-ratio:1/1;border-radius:8px;background:#F3EFFB"></div>
    <div style="height:16px;width:80%;margin:0 8px;border-radius:4px;background:#F3EFFB"></div>
    <div style="height:24px;width:50%;margin:0 8px;border-radius:4px;background:#F3EFFB"></div>
    <div style="height:36px;margin:0 8px 8px;border-radius:9999px;background:#F3EFFB"></div>
  </div>
</sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<article style="height:100%;display:flex;flex-direction:column;gap:12px;padding:8px;border:1px solid #EEEAF4;border-radius:16px;background:#FFFFFF;transition:transform 600ms cubic-bezier(0.32,0.72,0,1),box-shadow 600ms cubic-bezier(0.32,0.72,0,1)" style-hover="transform:translateY(-4px);box-shadow:0 16px 40px rgba(48,22,110,.10)">
  <a href="{{ p.href }}" aria-label="{{ p.nome }}" style="position:relative;display:grid;place-items:center;aspect-ratio:1/1;border-radius:8px;background:{{ p.tint }};text-decoration:none;overflow:hidden">
    <sc-if value="{{ p.img }}" hint-placeholder-val="{{ false }}"><img src="{{ p.img }}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></sc-if>
    <span style="position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px">
      <sc-if value="{{ p.selo }}" hint-placeholder-val="{{ false }}"><span style="padding:2px 8px;border-radius:4px;background:#FFD43B;color:#1E1730;font-size:12px;line-height:16px;font-weight:600">{{ p.selo }}</span></sc-if>
      <sc-if value="{{ p.offTxt }}" hint-placeholder-val="{{ false }}"><span style="padding:2px 8px;border-radius:4px;background:#1E1730;color:#FFFFFF;font-size:12px;line-height:16px;font-weight:600">{{ p.offTxt }}</span></sc-if>
    </span>
    <sc-if value="{{ p.recebaHoje }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:#FFFFFF;color:#2F5FD0;font-size:12px;line-height:16px;font-weight:600"><i class="ph-fill ph-lightning" style="font-size:12px"></i>Receba hoje SP</span></sc-if>
  </a>
  <div style="flex:1;display:flex;flex-direction:column;gap:8px;padding:0 8px 8px">
    <span style="display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:#5E5873"><i class="ph-fill ph-star" style="color:#F2B705;font-size:14px"></i><strong style="color:#1E1730;font-weight:600">{{ p.notaTxt }}</strong>({{ p.avalTxt }})</span>
    <a href="{{ p.href }}" style="font-size:14px;line-height:20px;font-weight:500;color:#1E1730;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px" style-hover="color:#6834CC">{{ p.nome }}</a>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px">
      <sc-if value="{{ p.deTxt }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:16px;color:#5E5873;text-decoration:line-through">{{ p.deTxt }}</span></sc-if>
      <span style="font-size:20px;line-height:28px;font-weight:700;color:#1E1730">{{ p.precoTxt }}</span>
      <span style="font-size:14px;line-height:20px;font-weight:600;color:#6834CC">{{ p.pixTxt }} no Pix</span>
      <span style="font-size:12px;line-height:16px;color:#5E5873">ou 3x de {{ p.parcelaTxt }} sem juros</span>
    </div>
    <button onClick="{{ add }}" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border:0;border-radius:9999px;background:{{ btnBg }};color:#FFFFFF;font-size:14px;line-height:20px;font-weight:600;cursor:pointer;transition:transform 400ms cubic-bezier(0.32,0.72,0,1),background 400ms cubic-bezier(0.32,0.72,0,1)" style-hover="background:#4B21A0" style-active="transform:scale(0.98)" style-focus="outline:3px solid #6699FF;outline-offset:2px"><i class="{{ btnIcon }}" style="font-size:16px"></i>{{ btnTxt }}</button>
  </div>
</article>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:440},&quot;pid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;tapete-30&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { m: null, added: false };
  componentDidMount() { import((window.__resources && window.__resources.catalogo) || new URL('./catalogo.js', document.baseURI).href).then(m => this.setState({ m })); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const { m, added } = this.state;
    const raw = m && m.produtos.find(x => x.id === (this.props.pid ?? 'tapete-30'));
    if (!raw) return { loading: true, ready: false, p: {} };
    const p = {
      ...raw, href: m.U.prod(raw.id), icon: m.ICON[raw.cat], tint: m.TINT[raw.cat], selo: raw.selo || '', recebaHoje: !!raw.recebaHoje,
      offTxt: raw.de ? '-' + Math.round((1 - raw.preco / raw.de) * 100) + '%' : '',
      notaTxt: raw.nota.toFixed(1).replace('.', ','), avalTxt: raw.aval.toLocaleString('pt-BR'),
      precoTxt: m.brl(raw.preco), deTxt: raw.de ? m.brl(raw.de) : '', pixTxt: m.brl(raw.pix), parcelaTxt: m.brl(raw.parcela)
    };
    return {
      loading: false, ready: true, p,
      btnTxt: added ? 'Adicionado' : 'Adicionar', btnIcon: added ? 'ph-bold ph-check' : 'ph-bold ph-shopping-bag', btnBg: added ? '#2F5FD0' : '#6834CC',
      add: () => { m.addToCart(raw.id); this.setState({ added: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ added: false }), 1800); }
    };
  }
}
</script>
</body>
</html>
